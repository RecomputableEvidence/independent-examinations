name: Validate examination infrastructure
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Standard-library unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Demonstrate neutral comparator
        run: python3 tools/compare_receipts.py examples/left.json examples/right.json

# This workflow checks infrastructure only; it does not certify examinations,
# execute untrusted candidate binaries, or grant any operational permission.
